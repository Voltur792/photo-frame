<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="http://astra-plugin.localhost/bridge/astra-bridge.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Frame</title>
  <style>
    :root {
      color-scheme: normal;
      --text: var(--color-text, #f7f6ff);
      --muted: var(--color-text-muted, #89869b);
      --stroke: var(--color-border, rgba(255,255,255,.14));
      --glass: color-mix(in srgb, var(--color-surface, #808080) 34%, transparent);
      --dur: .9s;
    }
    body { color-scheme: light dark; }
    html, body { background: transparent; margin: 0; width: 100%; height: 100%; overflow: hidden; }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    #frame { position: fixed; inset: 0; font-family: var(--font-sans, 'Segoe UI', system-ui, sans-serif); }
    #mat { position: absolute; inset: 0; }
    .frame-glass #mat { background: var(--glass); }
    .frame-dark #mat { background: #101116; }
    .frame-white #mat { background: #f6f4ef; }
    .frame-gallery #mat { background: #fbfaf7; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
    #stage { position: absolute; overflow: hidden; background:
      color-mix(in srgb, var(--color-surface, #333) 18%, transparent); }
    html.host-card #mat, html.host-card #stage { background: transparent; }
    .layer { position: absolute; margin: 0; width: 100%; height: 100%; object-fit: contain;
      opacity: 0; pointer-events: none; background: transparent; }
    .layer.show { opacity: 1; }
    html.fade .layer { transition: opacity var(--dur) ease; }
    html.slide .layer.go-in { animation: slide-in var(--dur) ease both; }
    html.slide .layer.go-out { animation: slide-out var(--dur) ease both; }
    @keyframes slide-in { from { opacity: 0; transform: translateX(24%); }
      to { opacity: 1; transform: none; } }
    @keyframes slide-out { from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translateX(-24%); } }
    .layer.kb { animation: kb var(--kb, 12s) linear both; }
    @keyframes kb { from { transform: scale(1.02) translate(0, 0); }
      to { transform: scale(1.14) translate(var(--kbx, 2%), var(--kby, -2%)); } }
    #caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 14px 9px;
      font-size: 13px; text-align: center; color: #f2f1f7; pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,.75); background: linear-gradient(transparent, rgba(0,0,0,.5));
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; z-index: 3; }
    #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      text-align: center; color: var(--muted); font-size: 13px; padding: 14px; line-height: 1.5; z-index: 4; }
    #empty.show { display: flex; }
    #reload { position: absolute; top: 6px; right: 6px; display: none; border: 1px solid var(--stroke);
      background: rgba(0,0,0,.35); color: var(--text); border-radius: 8px; padding: 2px 8px;
      font-size: 13px; cursor: pointer; z-index: 4; }
    #reload.show { display: block; }
  </style>
</head>
<body>
  <div id="frame">
    <div id="mat"></div>
    <div id="stage">
      <div id="caption"></div>
      <div id="empty"></div>
      <button id="reload" title="Обновить список кадров">⟳</button>
    </div>
  </div>
  <script>
    "use strict";
    if (window.astra && window.astra.widget) document.documentElement.classList.add('host-card');
    const $ = id => document.getElementById(id);
    const html = document.documentElement;
    const els = { frame: $('frame'), mat: $('mat'), stage: $('stage'),
                  caption: $('caption'), empty: $('empty'), reload: $('reload') };
    const call = (method, params) => {
      const api = window.astra;
      const fn = api && (api.callBackend || api.call);
      return fn ? fn.call(api, method, params) : Promise.reject(new Error('bridge not ready'));
    };
    const esc = s => String(s || '').replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const CFG = { folders: [], recursive: false, shuffle: true, interval: 10, transition: 'fade',
                  fit: 'contain', frame: 'glass', padding: 14, radius: 10, caption: 'none',
                  video_mode: 'once' };
    function normalizeConfig(raw) {
      const c = Object.assign({}, CFG, raw && typeof raw === 'object' ? raw : {});
      const b = (v, d) => typeof v === 'boolean' ? v : typeof v === 'string'
        ? /^true|1|да$/i.test(v.trim()) : /^false|0|нет$/i.test(String(v).trim()) ? false : d;
      c.recursive = b(raw?.recursive, CFG.recursive);
      c.shuffle = b(raw?.shuffle, CFG.shuffle);
      c.folders = Array.isArray(raw?.folders) ? raw.folders.filter(x => typeof x === 'string' && x.trim())
        : (typeof raw?.folders === 'string' ? raw.folders.split(/[;\n]/).filter(x => x.trim())
          : (raw?.folder ? [raw.folder] : []));
      c.interval = Math.min(3600, Math.max(2, Number(c.interval) || CFG.interval));
      c.transition = ['fade', 'slide', 'kenburns', 'none'].includes(c.transition) ? c.transition : 'fade';
      c.fit = c.fit === 'cover' ? 'cover' : 'contain';
      c.frame = ['glass', 'transparent', 'dark', 'white', 'gallery'].includes(c.frame) ? c.frame : 'glass';
      c.caption = ['none', 'name', 'date', 'clock'].includes(c.caption) ? c.caption : 'none';
      c.video_mode = c.video_mode === 'loop' ? 'loop' : 'once';
      c.padding = Math.min(80, Math.max(0, Number(c.padding) || 0));
      c.radius = Math.min(48, Math.max(0, Number(c.radius) || 0));
      return c;
    }

    let ctx = { preview: false, active: true, width: 0, height: 0, config: {} };
    let cfg = normalizeConfig({});
    let byId = {}, order = [], index = -1, err = '';
    let timer = null, clockTimer = null, resizeTimer = null, seq = 0;
    let activeEl = null, disposed = false;
    const ready = new Map();
    const broken = new Set();

    function seeded() {
      const list = orderFromIds();
      if (!cfg.shuffle) return list;
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }
    function orderFromIds() { return Object.keys(byId); }

    function layout() {
      html.classList.remove('fade', 'slide');
      if (cfg.transition === 'fade' || cfg.transition === 'kenburns') html.classList.add('fade');
      if (cfg.transition === 'slide') html.classList.add('slide');
      els.frame.className = cfg.frame === 'transparent' ? 'frame' : 'frame frame-' + cfg.frame;
      const pad = cfg.frame === 'transparent' ? 0 : cfg.padding;
      els.stage.style.left = pad + 'px'; els.stage.style.top = pad + 'px';
      els.stage.style.right = pad + 'px'; els.stage.style.bottom = pad + 'px';
      els.stage.style.borderRadius = cfg.radius + 'px';
    }

    function captionFor(photo) {
      if (cfg.caption === 'name') return photo ? photo.name : '';
      if (cfg.caption === 'date' && photo && photo.mtime)
        return new Date(photo.mtime * 1000).toLocaleDateString('ru-RU');
      return '';
    }

    function applyCaption() {
      const photo = byId[order[index]];
      if (cfg.caption === 'clock') {
        els.caption.style.display = 'block';
        els.caption.textContent = new Date().toLocaleTimeString('ru-RU',
          { hour: '2-digit', minute: '2-digit' });
        if (!clockTimer) clockTimer = setInterval(applyCaption, 30000);
      } else {
        if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
        const text = captionFor(photo);
        els.caption.style.display = text && cfg.caption !== 'none' ? 'block' : 'none';
        els.caption.textContent = text;
      }
    }

    function showEmpty() {
      els.empty.innerHTML = err ? esc(err) :
        (order.length ? '' : 'Папка пуста или подходящих файлов нет.<br>Откройте «Настройки рамки» и выберите папки с фото или видео');
      els.empty.classList.toggle('show', Boolean(err) || (!order.length && !ctx.preview));
      els.reload.classList.add('show');
    }

    function maxSide() {
      const side = Math.max(ctx.width || 400, ctx.height || 400, 200);
      return Math.round(Math.min(1800, Math.max(320, side * (window.devicePixelRatio || 1) * 1.3)));
    }

    function mediaFullUrl(url) {
      const sep = url.includes('?') ? '&' : '?';
      return url + sep + 's=' + maxSide();
    }
    function mediaQuickUrl(url) { return url.replace('/full/', '/quick/'); }

    function styleLayer(el) {
      el.className = 'layer';
      el.style.objectFit = cfg.fit;
      el.style.borderRadius = cfg.radius ? (cfg.radius - 2) + 'px' : '';
    }

    function decodeImg(src) {
      return new Promise((resolve, reject) => {
        const el = document.createElement('img');
        styleLayer(el);
        el.alt = '';
        const ok = () => {
          if (el.decode) el.decode().then(() => resolve(el), () => resolve(el));
          else resolve(el);
        };
        el.addEventListener('load', ok, { once: true });
        el.addEventListener('error', () => reject(new Error('image load failed')), { once: true });
        el.src = src;
      });
    }

    function bridgeFetch(id, stage, side) {
      return call('pf_photo', { id, stage, max_side: side || 0 }).then(r => {
        if (!r) throw new Error('bridge returned empty');
        if (r.ok) return r;
        throw new Error(r.err || r.error || 'bridge error');
      });
    }

    function prepareBridgeImage(item) {
      return bridgeFetch(item.id, 'quick', 720).then(r =>
        decodeImg(r.data).then(el => {
          const side = maxSide();
          if (side > 724) {
            bridgeFetch(item.id, 'full', side)
              .then(f => { if (f.kind === 'image') el.dataset.upgrade = f.data; })
              .catch(() => {});
          }
          return el;
        }));
    }

    function prepareImage(item) {
      if (!item.url) return prepareBridgeImage(item);
      return decodeImg(mediaQuickUrl(item.url))
        .then(el => { el.dataset.upgrade = mediaFullUrl(item.url); return el; })
        .catch(() => prepareBridgeImage(item));
    }

    function prepareVideo(item) {
      return new Promise((resolve, reject) => {
        const el = document.createElement('video');
        styleLayer(el);
        el.muted = true; el.playsInline = true; el.preload = 'auto';
        let done = false;
        const finish = ok => {
          if (done) return;
          done = true;
          if (ok) resolve(el); else reject(new Error('video load failed'));
        };
        el.addEventListener('loadeddata', () => finish(true), { once: true });
        el.addEventListener('error', () => {
          if (item.url && !el.dataset.fb) {
            el.dataset.fb = '1';
            bridgeFetch(item.id, 'raw', 0).then(r => { el.src = r.data; }).catch(() => finish(false));
          } else {
            finish(false);
          }
        });
        setTimeout(() => { if (!done && el.readyState > 0) finish(true); }, 5000);
        if (item.url) el.src = item.url;
        else bridgeFetch(item.id, 'raw', 0).then(r => { el.src = r.data; }).catch(() => finish(false));
      });
    }

    function prepare(item) {
      const cached = ready.get(item.id);
      if (cached) return cached;
      const task = (item.kind === 'video' ? prepareVideo : prepareImage)(item);
      const guarded = task.catch(e => { ready.delete(item.id); throw e; });
      ready.set(item.id, guarded);
      return guarded;
    }

    function upgradeToFull(el, src) {
      const warm = new Image();
      warm.addEventListener('load', () => {
        if (el.isConnected && !disposed) {
          el.dataset.fullSrc = src;
          el.src = src;
        }
      }, { once: true });
      warm.src = src;
    }

    function transitionIn(next, transition) {
      const prev = activeEl;
      if (prev && prev !== next) {
        if (transition === 'slide') prev.classList.add('go-out');
        const old = prev;
        setTimeout(() => { old.classList.remove('show'); }, 60);
        setTimeout(() => { if (old.isConnected) old.remove(); }, 1300);
      }
      if (transition === 'none') {
        next.classList.add('show');
      } else {
        void next.offsetWidth;
        if (transition === 'slide') next.classList.add('go-in');
        setTimeout(() => { if (next.isConnected) next.classList.add('show'); }, 40);
      }
      activeEl = next;
    }

    function startKenBurns(el) {
      el.style.setProperty('--kbx', (Math.random() * 4 - 2).toFixed(2) + '%');
      el.style.setProperty('--kby', (Math.random() * 4 - 2).toFixed(2) + '%');
      el.style.setProperty('--kb', Math.max(6, cfg.interval - 2) + 's');
      requestAnimationFrame(() => { if (el.isConnected) el.classList.add('kb'); });
    }

    function clearPlay() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    }
    function scheduleNext(delay) {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => { if (!disposed) step(1); }, delay);
    }

    function showLayer(el, item) {
      err = '';
      showEmpty();
      els.stage.appendChild(el);
      if (item.kind === 'video') {
        el.play().catch(() => {});
        el.addEventListener('error', () => {
          if (!disposed && !ctx.preview && cfg.video_mode === 'once') step(1);
        });
      }
      transitionIn(el, cfg.transition);
      if (cfg.transition === 'kenburns' && item.kind !== 'video') startKenBurns(el);
      applyCaption();
      if (item.kind === 'video') {
        if (cfg.video_mode === 'once') {
          const d = Number(el.duration);
          const remain = Number.isFinite(d) && d > 1
            ? Math.min(3600, Math.max(0, (d - (el.currentTime || 0)))) * 1000 + 400
            : cfg.interval * 1000;
          scheduleNext(remain);
        } else if (timer) {
          clearTimeout(timer); timer = null;
        }
      } else {
        scheduleNext(cfg.interval * 1000);
        if (el.dataset.upgrade) upgradeToFull(el, el.dataset.upgrade);
      }
      const peek = byId[order[(index + 1) % order.length]];
      if (peek && peek.id !== item.id) {
        const warm = prepare(peek);
        warm.catch(() => {});
      }
    }

    async function showCurrent() {
      if (disposed || ctx.preview || index < 0) return;
      const item = byId[order[index]];
      if (!item) return;
      const mySeq = seq;
      try {
        const el = await prepare(item);
        if (mySeq !== seq || disposed) { el.remove(); return; }
        styleLayer(el);
        ready.delete(item.id);
        showLayer(el, item);
      } catch (e) {
        if (mySeq !== seq || disposed) return;
        broken.add(item.id);
        if (broken.size >= order.length) {
          err = 'Ни один файл не загрузился — проверьте папки в настройках рамки.';
          showEmpty();
          return;
        }
        step(1);
      }
    }

    function step(delta) {
      if (!order.length) return;
      index = (index + delta + order.length) % order.length;
      if (!disposed) showCurrent();
    }

    async function refresh() {
      clearPlay();
      ready.clear();
      broken.clear();
      if (!cfg.folders.length) {
        byId = {}; order = []; index = -1; err = '';
        if (activeEl) { activeEl.remove(); activeEl = null; }
        showEmpty();
        return;
      }
      let state;
      try {
        state = await call('pf_state', { target: maxSide() }).then(r => {
          if (!r) throw new Error('bridge returned empty');
          if (r.ok) return r;
          throw new Error(r.err || r.error || 'bridge error');
        });
      } catch (e) {
        err = 'Бэкенд недоступен: ' + (e && e.message ? e.message : e);
        byId = {}; order = []; index = -1;
        showEmpty();
        scheduleNext(10000);
        return;
      }
      byId = {};
      for (const p of (state.photos || [])) byId[p.id] = p;
      order = seeded();
      err = state.error || '';
      index = order.length ? Math.min(Math.max(0, index), order.length - 1) : -1;
      if (activeEl) { activeEl.remove(); activeEl = null; }
      if (!order.length) { showEmpty(); return; }
      if (!err) showEmpty();
      showCurrent();
    }

    els.reload.addEventListener('click', e => { e.stopPropagation(); refresh(); });
    document.addEventListener('click', e => { e.stopPropagation(); });

    function applyContext(next, configChanged) {
      ctx = Object.assign({}, ctx, next || {});
      const newCfg = normalizeConfig(ctx.config);
      const configChangedLocal = configChanged ||
        JSON.stringify(newCfg) !== JSON.stringify(cfg);
      cfg = newCfg;
      layout();
      if (ctx.preview) {
        clearPlay();
        if (activeEl) { activeEl.remove(); activeEl = null; }
        byId = {}; order = []; index = -1; err = '';
        ready.clear(); broken.clear();
        els.empty.textContent = 'Так рамка будет выглядеть на рабочем столе';
        els.empty.classList.add('show');
        els.reload.classList.remove('show');
        return;
      }
      if (configChangedLocal) refresh();
      else if (!order.length) refresh();
      else showCurrent();
    }

    async function boot() {
      const w = window.astra && window.astra.widget;
      if (w && typeof w.setReady === 'function') w.setReady(true);
      let info = null;
      try {
        if (w && typeof w.getContext === 'function') info = await w.getContext();
      } catch (e) {}
      applyContext(info || {}, true);
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          const r = els.stage.getBoundingClientRect();
          if (Math.abs((r.width || 0) - (ctx.width || 0)) < 2
            && Math.abs((r.height || 0) - (ctx.height || 0)) < 2) return;
          ctx.width = r.width || 0;
          ctx.height = r.height || 0;
          if (resizeTimer) clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            resizeTimer = null;
            if (ctx.preview || disposed || !order.length) return;
            seq++;
            ready.clear();
            showCurrent();
          }, 500);
        });
        ro.observe(els.stage);
      }
    }

    window.addEventListener('pagehide', () => {
      disposed = true;
      clearPlay();
      ready.clear();
      if (activeEl) { activeEl.remove(); activeEl = null; }
    });

    if (window.astra && window.astra.onContextChange) {
      window.astra.onContextChange(c => {
        if (c && typeof c === 'object' && ('config' in c || 'width' in c || 'height' in c)) {
          applyContext(c, 'config' in c);
        } else {
          applyContext({ config: c || {} }, true);
        }
      });
    }
    window.addEventListener('resize', () => {
      if (typeof window.astra?.getWidgetContext === 'function') {
        applyContext(window.astra.getWidgetContext() || {}, false);
      }
    });
    boot();
  </script>
</body>
</html>
