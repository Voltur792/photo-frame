[project]
name = "photo_frame"
version = "0.1.0"
description = "Resizable photo frame desktop widget for Astra"
requires-python = ">=3.10"
dependencies = [
    "astra-plugin-sdk>=0.6.4,<0.7",
    "Pillow>=11.3,<13",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
